<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Companion</title><link rel="stylesheet" href="./style.css"></head><body><header><strong>Companion</strong><span class="muted">开发预览 · 03a</span><span class="spacer"></span><button id="open" disabled>打开 C 文件</button></header><div class="shell"><aside><small>文件</small><p id="folder" class="muted">尚未打开文件夹</p><div id="file"></div><p class="muted note">本阶段只展示已选文件；完整文件树后续接入。</p></aside><main><h1 id="title">打开你的代码</h1><p id="path" class="muted">选择普通 C 文件，无需初始化。</p><div id="work" hidden><label for="compiler">C 编译器 <small>可选，留空自动检测</small></label><input id="compiler" placeholder="gcc / cc / 已有编译器路径"><label for="input">输入数据</label><textarea id="input" rows="5" spellcheck="false" placeholder="可为空，不自动追加换行"></textarea><div class="actions"><button id="run" class="primary">编译并运行</button><button id="cancel" disabled>取消</button></div><p class="muted note">运行你信任的本地源码；不是安全沙箱。当前不比较预期输出。</p></div><p id="status" role="status">正在连接本地应用…</p><section id="result" hidden><h2>运行结果</h2><p id="meta" class="muted"></p><p id="stale" hidden>源文件在运行期间发生变化，结果已过期。</p><h3>标准输出</h3><pre id="stdout"></pre><h3>标准错误</h3><pre id="stderr"></pre><h3>编译诊断</h3><pre id="diagnostics"></pre></section></main></div><script type="module" src="./main.js"></script></body></html>
