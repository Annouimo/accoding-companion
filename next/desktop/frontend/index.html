<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Companion</title><link rel="stylesheet" href="./style.css"></head><body><header><strong>Companion</strong><span class="muted">开发预览 · 03b</span><span class="spacer"></span><button id="open" disabled>打开 C 文件</button></header><div class="shell"><aside><small>文件</small><p id="folder" class="muted">尚未打开文件夹</p><div id="file"></div><p class="muted note">完整文件树在 03c 接入。</p></aside><main><h1 id="title">打开你的代码</h1><p id="path" class="muted">选择普通 C 文件，无需初始化。</p><div id="work" hidden><label for="compiler">C 编译器 <small>留空自动检测</small></label><input id="compiler" placeholder="gcc / cc / 已有编译器路径"><div class="casehead"><h2>测试数据</h2><button id="add">＋ 添加</button><button id="save">保存样例</button><button id="reload">重新读取</button></div><div id="tabs" class="tabs"></div><p id="empty" class="muted">没有测试数据；可以添加样例或直接运行空输入。</p><div id="editor" hidden><label for="input">输入数据</label><textarea id="input" rows="4" spellcheck="false"></textarea><label class="check"><input id="compare" type="checkbox"> 比较预期输出</label><textarea id="expected" rows="3" spellcheck="false" placeholder="留空表示预期为空输出"></textarea><button id="remove">删除当前样例</button></div><p id="saved" class="muted note"></p><div class="actions"><button id="run" class="primary">运行当前样例</button><button id="all">运行全部</button><button id="cancel" disabled>取消</button></div><p class="muted note">本地比较忽略行尾空格、末尾空行和 CRLF 差异，不代表 OJ 判定。运行可信源码；不是安全沙箱。</p></div><p id="status" role="status">正在连接本地应用…</p><section id="result" hidden><h2>运行结果</h2><p id="meta" class="muted"></p><p id="stale" hidden>结果已过期，仍显示原运行快照；请重新测试。</p><div id="results"></div><h3>编译诊断</h3><div id="diagnostics"></div></section></main></div><script type="module" src="./main.js"></script></body></html>
