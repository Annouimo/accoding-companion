name: One-time WinGet install guide verification
on:
  push:
    branches: [test/winget-install-guide]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install WinLibs using the documented WinGet command
        shell: pwsh
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget install --id BrechtSanders.WinLibs.POSIX.UCRT -e --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @(([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') + ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'))
          $bin = $paths | ForEach-Object { [Environment]::ExpandEnvironmentVariables($_) } | Where-Object { $_ -match 'BrechtSanders|WinLibs' -and (Test-Path (Join-Path $_ 'gcc.exe')) -and (Test-Path (Join-Path $_ 'g++.exe')) } | Select-Object -First 1
          if (-not $bin) { throw 'WinGet installation did not expose a WinLibs bin directory in persistent PATH.' }
          Write-Host "Installed WinLibs bin: $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm install --no-audit --no-fund
      - name: Verify the new compiler and Unicode workspaces
        shell: pwsh
        run: |
          $cc = (Get-Command gcc.exe).Source
          $cxx = (Get-Command g++.exe).Source
          if ($cc -notmatch 'BrechtSanders|WinLibs' -or $cxx -notmatch 'BrechtSanders|WinLibs') { throw 'Wrong compiler resolved from PATH' }
          gcc --version
          g++ --version
          node --import tsx --test tests/standalone/compiler.test.ts
