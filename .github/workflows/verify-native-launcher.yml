name: Verify native launcher and external compilers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tests/standalone/pty-smoke.mjs dist/accoding.mjs
      - name: Save verified CLI for offline acceptance
        uses: actions/upload-artifact@v4
        with:
          name: verified-cli
          path: dist/accoding.mjs
          if-no-files-found: error
          retention-days: 7
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - run: npm run test:launcher
      - name: Test launcher and Unicode Node.js runtime
        working-directory: launcher
        env:
          ACCODING_TEST_NODE_DOWNLOAD: "1"
        run: go test -v ./...
  windows-external-gcc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose the external compiler to this CI job
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Join-Path $env:MSYS2_LOCATION 'ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm install --no-audit --no-fund
      - name: Test PATH and explicitly configured external compilers
        shell: pwsh
        run: |
          gcc --version
          g++ --version
          node --import tsx --test tests/standalone/compiler.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ACCODING_CC = (Get-Command gcc.exe).Source
          $env:ACCODING_CXX = (Get-Command g++.exe).Source
          node --import tsx --test tests/standalone/compiler.test.ts
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - run: bash scripts/package-launchers.sh "$RUNNER_TEMP/launcher-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: native-launchers
          path: ${{ runner.temp }}/launcher-dist/*.zip
          if-no-files-found: error
