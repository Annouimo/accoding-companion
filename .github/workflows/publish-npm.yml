name: Publish npm stable release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN builds only; PUBLISH_LATEST publishes the CLI; PUBLISH_LAUNCHERS publishes the ZIPs"
        type: choice
        required: true
        default: DRY_RUN
        options:
          - DRY_RUN
          - PUBLISH_LATEST
          - PUBLISH_LAUNCHERS
      expected_version:
        description: "Must exactly match the checked-out stable package.json"
        type: string
        required: true

      expected_preset_version:
        description: "Published C Exam Kit version required for a launcher release"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: npm-latest-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Build and validate Accoding Companion CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify the intended source branch and stable version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          node - <<'NODE'
          const fs=require("node:fs");
          const file="package.json";
          const pkg=JSON.parse(fs.readFileSync(file,"utf8"));
          if(pkg.name!=="@annouimo/accoding-companion") throw Error("Unexpected package name");
          if(pkg.repository?.url!=="git+https://github.com/Routilet/accoding-companion.git") throw Error("GitHub provenance repository mismatch");
          if(pkg.version!==process.env.EXPECTED_VERSION || !/^\d+\.\d+\.\d+$/.test(pkg.version)) throw Error("Expected version mismatch or not a stable version");
          delete pkg.private; // Only the runner copy becomes publishable.
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+"\n");
          NODE
      - name: Build, test, and pack
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node tests/standalone/pty-smoke.mjs dist/accoding.mjs
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarball
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  launcher:
    name: Verify launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:launcher
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - name: Verify Go launcher and managed toolchains
        working-directory: launcher
        env:
          ACCODING_TEST_NODE_DOWNLOAD: "1"
        run: go test -v ./...

  publish:
    name: Publish Accoding Companion CLI to npm latest
    needs: [pack, launcher, launcher-bundles]
    if: ${{ inputs.mode == 'PUBLISH_LATEST' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure OIDC compatible npm CLI
        run: npm install --global "npm@^11.21.0"
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: ./release
      - name: Publish stable package with npm OIDC
        run: |
          set -euo pipefail
          tarball="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          # npm must receive an explicit filesystem path, not a package/Git spec.
          npm publish "$(realpath "$tarball")" --tag latest --access public

  launcher-bundles:
    name: Package native launchers and offline guide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - run: bash scripts/package-launchers.sh "$RUNNER_TEMP/launcher-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: native-launchers
          path: ${{ runner.temp }}/launcher-dist/*.zip
          if-no-files-found: error
          retention-days: 7

  launcher-release:
    name: Publish double-click launcher ZIPs
    needs: [pack, launcher, launcher-bundles]
    if: ${{ inputs.mode == 'PUBLISH_LAUNCHERS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify both npm packages before publishing launchers
        env:
          EXPECTED_CLI: ${{ inputs.expected_version }}
          EXPECTED_PRESET: ${{ inputs.expected_preset_version }}
        run: |
          set -euo pipefail
          test "$(npm view @annouimo/accoding-companion@latest version)" = "$EXPECTED_CLI"
          test -n "$EXPECTED_PRESET"
          test "$(npm view @annouimo/c-exam-kit-preset@latest version)" = "$EXPECTED_PRESET"
      - uses: actions/download-artifact@v4
        with:
          name: native-launchers
          path: ./launcher-dist
      - name: Attach native launchers and guide to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          notes="docs/releases/$version.md"
          if [[ -f "$notes" ]]; then
            gh release create "v$version" launcher-dist/*.zip \
              --target "$GITHUB_SHA" --title "Accoding Companion $version" --notes-file "$notes"
          else
            gh release create "v$version" launcher-dist/*.zip \
              --target "$GITHUB_SHA" --title "Accoding Companion $version" \
              --notes "Download the ZIP for your operating system and architecture and extract all files. Open Accoding Launcher.exe on Windows or Accoding Launcher.command on macOS. The package includes an offline HTML guide."
          fi
