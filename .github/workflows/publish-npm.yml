name: Publish npm stable release

on:
  push:
    branches:
      - feat/lean-workspace-navigation
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN builds only; PUBLISH_LATEST publishes to npm latest"
        type: choice
        required: true
        default: DRY_RUN
        options:
          - DRY_RUN
          - PUBLISH_LATEST
      expected_version:
        description: "Must exactly match the checked-out stable package.json"
        type: string
        required: true
        default: "0.2.0"

permissions:
  contents: read

concurrency:
  group: npm-latest-publish
  cancel-in-progress: false

jobs:
  pack:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release npm latest 0.2.0' }}
    name: Build and validate Accoding Companion CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify the intended source branch and stable version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '0.2.0' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/lean-workspace-navigation"
          node - <<'NODE'
          const fs=require("node:fs");
          const file="package.json";
          const pkg=JSON.parse(fs.readFileSync(file,"utf8"));
          if(pkg.name!=="@annouimo/accoding-companion") throw Error("Unexpected package name");
          if(pkg.repository?.url!=="git+https://github.com/Annouimo/accoding-companion.git") throw Error("GitHub provenance repository mismatch");
          if(pkg.version!==process.env.EXPECTED_VERSION || !/^\d+\.\d+\.\d+$/.test(pkg.version)) throw Error("Expected version mismatch or not a stable version");
          delete pkg.private; // Only the runner copy becomes publishable.
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+"\n");
          NODE
      - name: Build, test, and pack
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node tests/standalone/pty-smoke.mjs dist/accoding.mjs
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-tarball
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  launcher:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release npm latest 0.2.0' }}
    name: Verify launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:launcher

  publish:
    name: Publish Accoding Companion CLI to npm latest
    needs: [pack, launcher]
    if: ${{ github.event_name == 'push' || inputs.mode == 'PUBLISH_LATEST' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure OIDC compatible npm CLI
        run: npm install --global "npm@^11.21.0"
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-tarball
          path: ./release
      - name: Wait for the stable C Exam Kit package to become installable
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            version="$(npm view @annouimo/c-exam-kit-preset@latest version --prefer-online --fetch-retries=0 --fetch-timeout=5000 2>/dev/null || true)"
            if [ "$version" = "0.6.4" ]; then exit 0; fi
            sleep 10
          done
          echo "C Exam Kit 0.6.4 is not available on npm latest." >&2
          exit 1
      - name: Publish stable package with npm OIDC
        run: |
          set -euo pipefail
          tarball="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          # npm must receive an explicit filesystem path, not a package/Git spec.
          npm publish "$(realpath "$tarball")" --tag latest --access public

  launcher-release:
    name: Publish double-click launcher ZIP
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attach launcher to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          zip -j "accoding-launcher-$version.zip" launch.command launch.cmd launch.ps1
          gh release create "v$version" "accoding-launcher-$version.zip" \
            --target "$GITHUB_SHA" --title "Accoding Companion $version" \
            --notes "Unzip the launcher. On macOS open launch.command. On Windows open launch.cmd. The launcher installs or updates Accoding Companion and C Exam Kit from npm, then starts Companion."
