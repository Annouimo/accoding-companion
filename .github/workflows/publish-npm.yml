name: Publish npm stable release

on:
  push:
    branches: [publish/launcher-0.2.4-windows]

permissions:
  contents: read

concurrency:
  group: launcher-release-0.2.4
  cancel-in-progress: false

jobs:
  launcher-bundles:
    if: ${{ github.event.head_commit.message == 'Release launchers 0.2.4 after Windows fix' }}
    name: Package native launchers and offline guide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - run: bash scripts/package-launchers.sh "$RUNNER_TEMP/launcher-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: native-launchers
          path: ${{ runner.temp }}/launcher-dist/*.zip
          if-no-files-found: error
          retention-days: 7

  launcher-release:
    name: Publish double-click launcher ZIPs
    needs: launcher-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify both npm packages before publishing launchers
        env:
          EXPECTED_CLI: 0.2.4
          EXPECTED_PRESET: 0.6.7
        run: |
          set -euo pipefail
          for attempt in $(seq 1 52); do
            companion="$(npm view @annouimo/accoding-companion@latest version --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)"
            preset="$(npm view @annouimo/c-exam-kit-preset@latest version --prefer-online --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true)"
            if test "$companion" = "$EXPECTED_CLI" && test "$preset" = "$EXPECTED_PRESET"; then exit 0; fi
            sleep 15
          done
          echo 'The expected Companion and C Exam Kit versions did not arrive on npm latest'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: native-launchers
          path: ./launcher-dist
      - name: Attach native launchers and guide to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          gh release create "v$version" launcher-dist/*.zip \
            --target "e3df49318594bd2ce3088186406704198416f36d" --title "Accoding Companion $version" \
            --notes "Download the ZIP for your operating system and architecture and extract all files. Open Accoding Launcher.exe on Windows or Accoding Launcher.command on macOS. The package includes an offline HTML guide."
