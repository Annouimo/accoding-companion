name: Publish npm preview (manual)

on:
  push:
    branches:
      - feat/lean-workspace-navigation
  workflow_dispatch:
    inputs:
      mode:
        description: "DRY_RUN builds only; PUBLISH_NEXT publishes to npm next"
        type: choice
        required: true
        default: DRY_RUN
        options:
          - DRY_RUN
          - PUBLISH_NEXT
      expected_version:
        description: "Must exactly match the checked-out prerelease package.json"
        type: string
        required: true
        default: "0.2.0-next.2"

permissions:
  contents: read

concurrency:
  group: npm-next-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Build and validate Accoding Companion CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify the intended source branch and prerelease version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '0.2.0-next.2' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/lean-workspace-navigation"
          node - <<'NODE'
          const fs=require("node:fs");
          const file="package.json";
          const pkg=JSON.parse(fs.readFileSync(file,"utf8"));
          if(pkg.name!=="@annouimo/accoding-companion") throw Error("Unexpected package name");
          if(pkg.repository?.url!=="git+https://github.com/Annouimo/accoding-companion.git") throw Error("GitHub provenance repository mismatch");
          if(pkg.version!==process.env.EXPECTED_VERSION || !/^\d+\.\d+\.\d+-next\.\d+$/.test(pkg.version)) throw Error("Expected version mismatch or not a next prerelease");
          delete pkg.private; // Only the runner copy becomes publishable.
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+"\n");
          NODE
      - name: Build, test, and pack
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - name: Verify published npm preview tags and install both packages
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Verify published npm preview tags' }}
        run: |
          set -euo pipefail
          npm view @annouimo/c-exam-kit-preset dist-tags --json --prefer-online
          npm view @annouimo/accoding-companion dist-tags --json --prefer-online
          test "$(npm view @annouimo/c-exam-kit-preset@next version --prefer-online)" = "0.6.4-next.1"
          test "$(npm view @annouimo/accoding-companion@next version --prefer-online)" = "0.2.0-next.2"
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/preview-install" @annouimo/c-exam-kit-preset@next @annouimo/accoding-companion@next
          "$RUNNER_TEMP/preview-install/node_modules/.bin/accoding" --version
          node -e 'const p=require(process.argv[1]); if(p.components.length!==287)throw Error("Unexpected component count"); console.log(p.components.length,"preset components installed")' "$RUNNER_TEMP/preview-install/node_modules/@annouimo/c-exam-kit-preset/preset/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-preview-tarball
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Accoding Companion CLI to npm next
    needs: pack
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'PUBLISH_NEXT') || (github.event_name == 'push' && github.event.head_commit.message == 'Release npm next 0.2.0-next.2') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure OIDC compatible npm CLI
        run: npm install --global "npm@^11.21.0"
      - uses: actions/download-artifact@v4
        with:
          name: npm-preview-tarball
          path: ./release
      - name: Publish approved prerelease package with npm OIDC
        run: |
          set -euo pipefail
          tarball="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          # npm must receive an explicit filesystem path, not a package/Git spec.
          npm publish "$(realpath "$tarball")" --tag next --access public
