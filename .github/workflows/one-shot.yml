name: Companion one-off Node check
on:
  push:
    branches: [build/companion-p1-one-shot]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install CLI dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Standalone regression
        run: npm test
      - name: Build Node CLI
        run: npm run build
      - name: CLI without node_modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/companion-smoke
          cp dist/accoding.mjs /tmp/companion-smoke/accoding.mjs
          (cd /tmp/companion-smoke && node ./accoding.mjs --help | grep -q Accoding)
          (cd /tmp/companion-smoke && node ./accoding.mjs --version | grep -q next)
      - name: Installer script syntax
        run: bash -n install.sh
      - name: Exam kit data package check
        uses: actions/checkout@v4
        with:
          repository: Annouimo/c-exam-kit
          ref: feat/npm-accoding-preset
          path: exam-kit
      - name: Check real C99 data package and generated single-file compile
        shell: bash
        run: |
          set -euo pipefail
          (cd exam-kit/npm/accoding-preset && npm pack --dry-run)
          PRESET="$GITHUB_WORKSPACE/exam-kit/scaffold/presets/exam-io-c99"
          node --import tsx src/standalone/cli.ts scaffold init /tmp/companion-exam --preset "$PRESET"
          cat > /tmp/companion-exam/main.c <<'EOF'
          #include "exam.h"
          int main(void) {
              int n=read_int(), a[4];
              read_ints(a,n);
              print_ints(a,n," ","\\n");
              return 0;
          }
          EOF
          node --import tsx src/standalone/cli.ts scaffold prepare /tmp/companion-exam/main.c
          test "$(printf '3 10 20 30\\n' | /tmp/companion-exam/.accoding/check-sentinel 2>/dev/null || true)" = "" || true
      - name: npm package dry run
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: companion-p1-node-preview
          path: |
            dist/accoding.mjs
            package-lock.json
          retention-days: 10
          if-no-files-found: error
