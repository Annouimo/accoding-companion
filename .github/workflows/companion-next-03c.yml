name: Companion Next 03c (no publishing)
on:
  push:
    branches: [feat/companion-next-03c]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-next-03c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feat/companion-next-03c'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: next/desktop/frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Core tests and vet
        run: |
          go test -v ./internal/localrun
          go vet ./internal/localrun
      - name: Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w -H windowsgui" -o out/companion.exe ./desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path out/companion.exe -DestinationPath out/companion-windows-amd64.zip
      - name: Apple Silicon GUI
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          app="out/Companion.app"
          mkdir -p "$app/Contents/MacOS"
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w" -o "$app/Contents/MacOS/companion" ./desktop
          cp desktop/Info.plist "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" out/companion-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: companion-03c-${{ matrix.os }}-${{ matrix.arch }}
          path: next/out/*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: companion-03c-locks-${{ matrix.os }}
          path: |
            next/go.mod
            next/go.sum
            next/desktop/frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
